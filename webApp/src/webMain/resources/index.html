<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective de mesa: Casos fríos</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 50 50" role="presentation">
            <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none"/>
            <circle cx="25" cy="25" r="20" stroke="#aaa" stroke-width="4" fill="none" stroke-linecap="round"
                    stroke-dasharray="90 125">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                                  repeatCount="indefinite"/>
            </circle>
        </svg>
    </div>
    <script>
        const observer = new MutationObserver(() => {
            const canvas = document.querySelector('canvas');
            if (canvas) {
                const loading = document.getElementById('loading');
                if (loading) loading.remove();
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true });
    </script>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
